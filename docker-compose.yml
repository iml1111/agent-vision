services:
  api:
    build: .
    container_name: agent-vision-api
    command: uvicorn entrypoints.api.app:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  worker:
    build: .
    container_name: agent-vision-worker
    command: python -m entrypoints.worker.app
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - api
